name: Pulso News Auto Sync

on:
  schedule:
    # Run every 15 minutes 24/7
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system font dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core fonts-freefont-ttf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch RSS Feeds
        run: |
          python scripts/fetch_feeds.py

      - name: Prepare Instagram Post
        env:
          INSTAGRAM_POST_COOLDOWN_HOURS: '3.0'
        run: |
          python scripts/instagram_publisher.py --prepare

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        continue-on-error: true
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NOTICIAS_PERSONALES_CL }}'
          channelId: live
          projectId: noticias-personales-cl

      - name: Publish to Instagram
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_POST_COOLDOWN_HOURS: '3.0'
        run: |
          python scripts/instagram_publisher.py --publish

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/instagram_history.json public/data/initial-feeds.json public/instagram_posts/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(sync): update feeds and instagram publication [skip ci]"
            pushed=0
            for i in 1 2 3 4 5; do
              echo "Intento $i de push..."
              if git pull --rebase origin main && git push origin main; then
                pushed=1
                break
              fi
              echo "Conflicto o carrera remota detectada. Reintentando..."
              git rebase --abort 2>/dev/null || true
              git pull origin main --no-edit -X ours 2>/dev/null || true
              if git push origin main; then
                pushed=1
                break
              fi
              sleep 2
            done
            if [ $pushed -eq 0 ]; then
              echo "Error: No se pudo realizar el push tras 5 intentos."
              exit 1
            fi
          fi
